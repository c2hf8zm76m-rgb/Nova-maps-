name: Build Audify Premium Overlay DEX

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/audify-premium-overlay/**'
      - '.github/workflows/audify-premium-overlay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform/build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Compile standalone Premium activity
        run: |
          rm -rf /tmp/audify-premium && mkdir -p /tmp/audify-premium/classes /tmp/audify-premium/dex
          javac -source 8 -target 8 -classpath "$ANDROID_HOME/platforms/android-36/android.jar" -d /tmp/audify-premium/classes tools/audify-premium-overlay/AudifyPremiumActivity.java
          jar cf /tmp/audify-premium/premium.jar -C /tmp/audify-premium/classes .
          "$ANDROID_HOME/build-tools/36.0.0/d8" --min-api 23 --output /tmp/audify-premium/dex /tmp/audify-premium/premium.jar
          mv /tmp/audify-premium/dex/classes.dex /tmp/audify-premium/AudifyPremiumOverlay.dex
          ls -lh /tmp/audify-premium/AudifyPremiumOverlay.dex
      - uses: actions/upload-artifact@v4
        with:
          name: AudifyPremiumOverlay-DEX
          path: /tmp/audify-premium/AudifyPremiumOverlay.dex
          if-no-files-found: error
          retention-days: 7
