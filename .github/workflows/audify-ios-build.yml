name: Build Audify iOS

on:
  push:
    branches: [main]
    paths:
      - 'audify/**'
      - 'audify-ios/**'
      - '.github/workflows/audify-ios-build.yml'
  workflow_dispatch:

concurrency:
  group: audify-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Capacitor
        working-directory: audify-ios
        run: npm install

      - name: Prepare Audify web assets
        working-directory: audify-ios
        run: npm run prepare:web

      - name: Generate iOS project
        working-directory: audify-ios
        run: npx cap add ios

      - name: Sync Capacitor
        working-directory: audify-ios
        run: npx cap sync ios

      - name: Enable iOS background audio
        working-directory: audify-ios
        run: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Audify" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Audify" "$PLIST"
          node scripts/patch-ios.mjs
          plutil -p "$PLIST" | grep -A4 UIBackgroundModes

      - name: Build for iPhone Simulator
        working-directory: audify-ios
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build unsigned iPhone app
        working-directory: audify-ios
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package unsigned IPA
        working-directory: audify-ios
        run: |
          rm -rf Payload Audify-iOS-Unsigned.ipa
          mkdir -p Payload
          cp -R build-device/Build/Products/Release-iphoneos/App.app Payload/Audify.app
          zip -qry Audify-iOS-Unsigned.ipa Payload
          ls -lh Audify-iOS-Unsigned.ipa

      - name: Package Xcode project
        working-directory: audify-ios
        run: |
          ditto -c -k --sequesterRsrc --keepParent ios Audify-iOS-Xcode.zip

      - name: Upload unsigned iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: Audify-iOS-Unsigned-IPA
          path: audify-ios/Audify-iOS-Unsigned.ipa
          retention-days: 14

      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: Audify-iOS-Xcode
          path: audify-ios/Audify-iOS-Xcode.zip
          retention-days: 14

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: Audify-iOS-Simulator-App
          path: audify-ios/build/Build/Products/Debug-iphonesimulator/App.app
          retention-days: 14
