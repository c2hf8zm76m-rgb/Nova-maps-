name: Check Audify Worker

on:
  push:
    branches: [main]
    paths:
      - '_worker.js'
      - 'audify/**'
      - '.github/workflows/check-audify-worker.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Audify search endpoint
        run: |
          set -x
          curl -i --fail --max-time 25 'https://weathered-truth-74c7.ten-dart.workers.dev/api/audify-search?q=niska'
