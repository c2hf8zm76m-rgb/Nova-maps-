name: Check Audify Search

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Audify Piped search
        run: |
          curl -sS --fail --max-time 15 \
            'https://api.piped.private.coffee/search?q=niska&filter=videos' \
            | head -c 1000
