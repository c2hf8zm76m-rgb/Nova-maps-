name: Check Audify Worker

on:
  push:
    branches: [main]
    paths:
      - '_worker.js'
      - 'audify/**'
      - '.github/workflows/check-audify-worker.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Jina YouTube search fallback
        run: |
          set -x
          curl -L --fail --max-time 30 'https://r.jina.ai/https://www.youtube.com/results?search_query=niska&hl=fr' -o /tmp/jina.txt
          head -n 80 /tmp/jina.txt
          grep -Eo 'watch\?v=[A-Za-z0-9_-]{11}' /tmp/jina.txt | head -n 8
