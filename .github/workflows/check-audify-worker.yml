name: Check Audify Worker

on:
  push:
    branches: [main]
    paths:
      - '_worker.js'
      - 'audify/**'
      - '.github/workflows/check-audify-worker.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Piped YouTube search instances
        shell: bash
        run: |
          set +e
          for base in \
            'https://pipedapi.kavin.rocks' \
            'https://pipedapi.tokhmi.xyz' \
            'https://pipedapi.moomoo.me' \
            'https://pipedapi.syncpundit.io' \
            'https://api-piped.mha.fi' \
            'https://piped-api.garudalinux.org' \
            'https://pipedapi.rivo.lol' \
            'https://pipedapi.leptons.xyz'; do
            echo "===== $base ====="
            curl -sS --max-time 12 -D /tmp/headers "$base/search?q=niska&filter=videos" -o /tmp/body
            code=$?
            echo "curl=$code"
            grep -iE 'HTTP/|access-control-allow-origin|content-type' /tmp/headers | tail -n 6 || true
            head -c 300 /tmp/body || true
            echo
          done
