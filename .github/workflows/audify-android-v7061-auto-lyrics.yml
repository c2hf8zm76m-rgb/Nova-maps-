name: Build Audify Android V70.6.1 Auto Lyrics

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'audify/**'
      - 'audify-android/**'
      - '!audify-android/releases/**'
      - '.github/workflows/audify-android-v7061-auto-lyrics.yml'

permissions:
  contents: read

concurrency:
  group: audify-v7061-auto-lyrics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: audify-android
        run: npm install

      - name: Prepare web UI
        working-directory: audify-android
        run: npm run prepare:web

      - name: Generate Capacitor Android project
        working-directory: audify-android
        run: npx cap add android

      - name: Sync Capacitor Android
        working-directory: audify-android
        run: npx cap sync android

      - name: Build validated V69 base
        working-directory: audify-android
        run: node scripts/v68132-safe-patch-chain.mjs

      - name: Apply V70 widgets
        working-directory: audify-android
        run: |
          node scripts/v7000-queue-lyrics-live-widgets.mjs
          node scripts/v7010-widget-polish.mjs

      - name: Apply V70.6.1 automatic lyrics background resolver
        working-directory: audify-android
        run: node scripts/v7061-auto-lyrics-background.mjs

      - name: Verify V70.6.1 source hooks
        working-directory: audify-android
        run: |
          grep -q 'versionCode 7061' android/app/build.gradle
          grep -q 'versionName "70.6.1"' android/app/build.gradle
          grep -q 'AUDIFY_V7061_AUTO_LYRICS_BACKGROUND' android/app/src/main/java/com/nova/audify/AudifyAutoLyricsResolver.java
          grep -q 'AUDIFY_V7061_AUTO_LYRICS_SERVICE_HOOK' android/app/src/main/java/com/nova/audify/AudifyPlaybackService.java
          grep -q 'publishLyricsTimeline' android/app/src/main/java/com/nova/audify/AudifyWidgetFamilyState.java
          test -f android/app/src/main/res/layout/audify_widget_lyrics.xml

      - name: Build APK
        working-directory: audify-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p out
          cp audify-android/android/app/build/outputs/apk/debug/app-debug.apk out/Audify-V70.6.1-AUTO-LYRICS-BACKGROUND.apk
          sha256sum out/Audify-V70.6.1-AUTO-LYRICS-BACKGROUND.apk | tee out/SHA256.txt

      - name: Verify compiled markers
        run: |
          python - <<'PY'
          import re,zipfile
          p='out/Audify-V70.6.1-AUTO-LYRICS-BACKGROUND.apk'
          with zipfile.ZipFile(p) as z:
              dex=b''.join(z.read(n) for n in z.namelist() if re.fullmatch(r'classes\d*\.dex',n))
          for marker in [b'AUDIFY_V7061_AUTO_LYRICS_BACKGROUND',b'AUDIFY_V68190_LYRICS_TIMELINE_BRIDGE']:
              if marker not in dex: raise SystemExit('missing compiled marker '+marker.decode())
          print('V70.6.1 compiled markers verified')
          PY

      - name: Upload V70.6.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: Audify-V70.6.1-AUTO-LYRICS-BACKGROUND
          path: |
            out/Audify-V70.6.1-AUTO-LYRICS-BACKGROUND.apk
            out/SHA256.txt
          if-no-files-found: error
          retention-days: 30
