name: Build Audify Instant Albums V68.12.55

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'audify-android/share-overlay/AudifyAlbumIdentifier.java'
      - 'audify-android/share-overlay/AudifyInstantAlbum*.java'
      - '.github/workflows/audify-instant-albums.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile Instant Albums overlay
        run: |
          set -euxo pipefail
          rm -rf build/instant-albums
          mkdir -p build/instant-albums/classes build/instant-albums/dex
          javac -source 8 -target 8 \
            -classpath "$ANDROID_SDK_ROOT/platforms/android-35/android.jar" \
            -d build/instant-albums/classes \
            audify-android/share-overlay/AudifyAlbumIdentifier.java \
            audify-android/share-overlay/AudifyInstantAlbums.java \
            audify-android/share-overlay/AudifyInstantAlbumMetadata.java \
            audify-android/share-overlay/AudifyInstantAlbumResolver.java \
            audify-android/share-overlay/AudifyInstantAlbumArtwork.java \
            audify-android/share-overlay/AudifyInstantAlbumLibrary.java
          jar cf build/instant-albums/instant-albums.jar -C build/instant-albums/classes .
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/d8" \
            --min-api 23 \
            --output build/instant-albums/dex \
            build/instant-albums/instant-albums.jar
          cp build/instant-albums/dex/classes.dex build/instant-albums/instant-albums.dex
          sha256sum build/instant-albums/instant-albums.dex
      - uses: actions/upload-artifact@v4
        with:
          name: Audify-Instant-Albums-V68.12.55-DEX
          path: build/instant-albums/instant-albums.dex
          if-no-files-found: error
          retention-days: 7
