name: Diagnose Audify Android V68.12.58.1 package

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'audify/**'
      - 'audify-android/**'
      - '!audify-android/releases/**'
      - '.github/workflows/audify-android-build.yml'

permissions:
  contents: read

concurrency:
  group: audify-android-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36"
      - name: Install Audify Android dependencies
        working-directory: audify-android
        run: npm install
      - name: Prepare Audify web UI
        working-directory: audify-android
        run: npm run prepare:web
      - name: Generate Capacitor Android project
        working-directory: audify-android
        run: npx cap add android
      - name: Sync Capacitor Android
        working-directory: audify-android
        run: npx cap sync android
      - name: Apply Audify native engine and V68.12.58 Multi-Source Album Intelligence
        working-directory: audify-android
        run: npm run android:patch
      - name: Restore V68.12.54 Android dependency footprint
        working-directory: audify-android
        run: node scripts/v6812581-full-package-restore.mjs
      - name: Build diagnostic APK
        working-directory: audify-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Prepare diagnostic APK and report
        run: |
          mkdir -p audify-android/releases
          cp audify-android/android/app/build/outputs/apk/debug/app-debug.apk audify-android/releases/Audify-V68.12.58.1-DIAGNOSTIC.apk
          python - <<'PY'
          import os,zipfile,json
          p='audify-android/releases/Audify-V68.12.58.1-DIAGNOSTIC.apk'
          z=zipfile.ZipFile(p)
          names=z.namelist()
          report={
            'bytes':os.path.getsize(p),
            'dex':[n for n in names if n.startswith('classes') and n.endswith('.dex')],
            'native_libs':[n for n in names if n.startswith('lib/')],
            'res_count':sum(n.startswith('res/') for n in names),
            'entries':len(names),
            'assets_public_count':sum(n.startswith('assets/public/') for n in names),
          }
          print(json.dumps(report,indent=2))
          open('audify-android/releases/V68.12.58.1-DIAGNOSTIC-REPORT.json','w').write(json.dumps(report,indent=2))
          PY
      - name: Upload diagnostic APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Audify-V68.12.58.1-DIAGNOSTIC
          path: |
            audify-android/releases/Audify-V68.12.58.1-DIAGNOSTIC.apk
            audify-android/releases/V68.12.58.1-DIAGNOSTIC-REPORT.json
          if-no-files-found: error
          retention-days: 2
