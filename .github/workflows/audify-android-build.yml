name: Build Audify Android V68.13.1 Clickable Album Tracks

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'audify/**'
      - 'audify-android/**'
      - '!audify-android/releases/**'
      - '.github/workflows/audify-android-build.yml'

permissions:
  contents: write

concurrency:
  group: audify-android-v68131-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Audify Android dependencies
        working-directory: audify-android
        run: npm install

      - name: Prepare Audify web UI
        working-directory: audify-android
        run: npm run prepare:web

      - name: Generate Capacitor Android project
        working-directory: audify-android
        run: npx cap add android

      - name: Sync Capacitor Android
        working-directory: audify-android
        run: npx cap sync android

      - name: Apply Audify native engine and V68.13.1 clickable album tracks
        working-directory: audify-android
        run: npm run android:patch

      - name: Build V68.13.1 APK
        working-directory: audify-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare V68.13.1 APK and verification report
        run: |
          mkdir -p audify-android/releases
          cp audify-android/android/app/build/outputs/apk/debug/app-debug.apk audify-android/releases/Audify-V68.13.1-CLICKABLE-ALBUM-TRACKS.apk
          python - <<'PY'
          import json, os, re, zipfile
          p='audify-android/releases/Audify-V68.13.1-CLICKABLE-ALBUM-TRACKS.apk'
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              dex=[n for n in names if re.fullmatch(r'classes\d*\.dex',n)]
              marker=b'AUDIFY_V68131_CLICKABLE_ALBUM_TRACKS'
              open_album='Ouvrir cet album'.encode('utf-8')
              clickable='Lire '.encode('utf-8')
              blobs=[z.read(n) for n in dex]
              report={
                  'version':'V68.13.1',
                  'bytes':os.path.getsize(p),
                  'dex':dex,
                  'clickable_album_tracks_marker_compiled':any(marker in b for b in blobs),
                  'open_album_action_compiled':any(open_album in b for b in blobs),
                  'track_play_action_compiled':any(clickable in b for b in blobs),
              }
          if not report['clickable_album_tracks_marker_compiled']:
              raise SystemExit('V68.13.1 clickable album track marker missing from compiled APK')
          if not report['track_play_action_compiled']:
              raise SystemExit('V68.13.1 track play action missing from compiled APK')
          print(json.dumps(report,indent=2))
          open('audify-android/releases/V68.13.1-CLICKABLE-ALBUM-TRACKS-REPORT.json','w').write(json.dumps(report,indent=2))
          PY

      - name: Upload V68.13.1 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Audify-V68.13.1-CLICKABLE-ALBUM-TRACKS-APK
          path: |
            audify-android/releases/Audify-V68.13.1-CLICKABLE-ALBUM-TRACKS.apk
            audify-android/releases/V68.13.1-CLICKABLE-ALBUM-TRACKS-REPORT.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish V68.13.1 APK in repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f audify-android/releases/Audify-V68.13.1-CLICKABLE-ALBUM-TRACKS.apk
          git add -f audify-android/releases/V68.13.1-CLICKABLE-ALBUM-TRACKS-REPORT.json
          if git diff --cached --quiet; then
            echo 'APK unchanged'
            exit 0
          fi
          git commit -m 'Publish Audify V68.13.1 Clickable Album Tracks APK'
          git pull --rebase origin main
          git push origin HEAD:main
