name: Build Audify Android V68.12.38

on:
  workflow_dispatch:
  pull_request:
    paths: ['audify/**', 'audify-android/**', '.github/workflows/audify-android-build.yml']
  push:
    branches: [ main, codex/audify-firebase-68.12.37 ]
    paths:
      - 'audify/**'
      - 'audify-android/**'
      - '!audify-android/releases/**'
      - '.github/workflows/audify-android-build.yml'

permissions:
  contents: write

concurrency:
  group: audify-android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firebase-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: audify-android/firebase
      - run: npm run test:rules
        working-directory: audify-android/firebase
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36"
      - name: Install Audify Android dependencies
        working-directory: audify-android
        run: npm install --no-audit --no-fund
      - name: Prepare Audify web UI
        working-directory: audify-android
        run: npm run prepare:web
      - name: Generate Capacitor Android project
        working-directory: audify-android
        run: npx cap add android
      - name: Sync Capacitor Android
        working-directory: audify-android
        run: npx cap sync android
      - name: Apply Audify native engine and V68.12.38 Chroma startup and real readiness
        working-directory: audify-android
        run: npm run android:patch
      - name: Verify startup readiness and generated launcher
        working-directory: audify-android
        run: npm run test:startup
      - name: Build debug APK
        working-directory: audify-android/android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Print debug APK signing fingerprints
        working-directory: audify-android/android
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare Audify V68.12.38 APK
        run: |
          mkdir -p audify-android/releases
          cp audify-android/android/app/build/outputs/apk/debug/app-debug.apk audify-android/releases/Audify-V68.12.38.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Audify-V68.12.38-APK
          path: audify-android/releases/Audify-V68.12.38.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK in repository
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f audify-android/releases/Audify-V68.12.38.apk
          if git diff --cached --quiet; then
            echo 'APK unchanged'
            exit 0
          fi
          git commit -m 'Publish Audify V68.12.38 APK'
          git pull --rebase origin main
          git push origin HEAD:main
