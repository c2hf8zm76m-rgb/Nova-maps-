name: Build Audify Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'audify-android/**'
      - '!audify-android/releases/**'
      - '.github/workflows/audify-android-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p audify-android assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          cp audify-android/app/build/outputs/apk/debug/app-debug.apk Audify-V58.apk
          mkdir -p audify-android/releases
          cp Audify-V58.apk audify-android/releases/Audify-V58.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Audify-V58-APK
          path: Audify-V58.apk
          if-no-files-found: error

      - name: Publish APK in repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f audify-android/releases/Audify-V58.apk
          git diff --cached --quiet || git commit -m 'Publish Audify V58 APK'
          git push
