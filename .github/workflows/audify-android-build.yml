name: Build Audify Android V68.16.6 Fast Proof Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'audify/**'
      - 'audify-android/**'
      - '!audify-android/releases/**'
      - '.github/workflows/audify-android-build.yml'

permissions:
  contents: write

concurrency:
  group: audify-android-v68166-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Audify Android dependencies
        working-directory: audify-android
        run: npm install

      - name: Prepare Audify web UI
        working-directory: audify-android
        run: npm run prepare:web

      - name: Generate Capacitor Android project
        working-directory: audify-android
        run: npx cap add android

      - name: Sync Capacitor Android
        working-directory: audify-android
        run: npx cap sync android

      - name: Apply safe patch chain without legacy Pulse Splash
        working-directory: audify-android
        run: node scripts/v68132-safe-patch-chain.mjs

      - name: Build V68.16.6 APK
        working-directory: audify-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare V68.16.6 APK and permanent verification
        run: |
          mkdir -p audify-android/releases
          cp audify-android/android/app/build/outputs/apk/debug/app-debug.apk audify-android/releases/Audify-V68.16.6-FAST-PROOF-PIPELINE.apk
          python - <<'PY'
          import json, os, re, zipfile
          p='audify-android/releases/Audify-V68.16.6-FAST-PROOF-PIPELINE.apk'
          with zipfile.ZipFile(p) as z:
              dex=[n for n in z.namelist() if re.fullmatch(r'classes\d*\.dex',n)]
              all_dex=b''.join(z.read(n) for n in dex)
          required={
              'fast_proof_pipeline':b'AUDIFY_V68166_FAST_PROOF_PIPELINE',
              'parallel_release_proofs':b'AUDIFY_V68166_PARALLEL_RELEASE_PROOFS',
              'bounded_proof_wait':b'AUDIFY_V68166_BOUNDED_PROOF_WAIT',
              'apple_hint_early_stop':b'AUDIFY_V68166_APPLE_HINT_EARLY_STOP',
              'apple_hint_first_lookup':b'AUDIFY_V68165_APPLE_HINT_FIRST_LOOKUP',
              'hint_tracklist_proof':b'AUDIFY_V68165_HINT_TRACKLIST_PROOF',
              'deezer_artist_name_fallback':b'AUDIFY_V68165_DEEZER_ARTIST_NAME_FALLBACK',
              'hint_discography_proof':b'AUDIFY_V68165_HINT_DISCOGRAPHY_PROOF',
              'album_diagnostic_trace':b'AUDIFY_V68164_ALBUM_DIAGNOSTIC_TRACE',
              'visible_failure_diagnostic':b'AUDIFY_V68164_VISIBLE_FAILURE_DIAGNOSTIC',
              'apple_reject_reasons':b'AUDIFY_V68164_APPLE_REJECT_REASONS',
              'deezer_reject_reasons':b'AUDIFY_V68164_DEEZER_REJECT_REASONS',
              'innertube_video_details':b'AUDIFY_V68163_INNERTUBE_VIDEO_DETAILS',
              'video_description_evidence':b'AUDIFY_V68163_VIDEO_DESCRIPTION_EVIDENCE',
              'innertube_video_evidence_bridge':b'AUDIFY_V68163_INNERTUBE_VIDEO_EVIDENCE_BRIDGE',
              'html_optional_fallback':b'AUDIFY_V68163_HTML_OPTIONAL_FALLBACK',
              'video_id_to_album_engine':b'AUDIFY_V68163_VIDEO_ID_TO_ALBUM_ENGINE',
              'official_album_mention_intelligence':b'AUDIFY_V68162_OFFICIAL_ALBUM_MENTION_INTELLIGENCE',
              'natural_language_album_hint':b'AUDIFY_V68162_NATURAL_LANGUAGE_ALBUM_HINT',
              'description_release_relation':b'AUDIFY_V68162_DESCRIPTION_RELEASE_RELATION',
              'hint_to_collection_lookup':b'AUDIFY_V68162_HINT_TO_COLLECTION_LOOKUP',
              'apple_release_graph':b'AUDIFY_V68161_APPLE_RELEASE_GRAPH',
              'multi_variant_title_search':b'AUDIFY_V68161_MULTI_VARIANT_TITLE_SEARCH',
              'apple_tracklist_relation_proof':b'AUDIFY_V68161_APPLE_TRACKLIST_RELATION_PROOF',
              'autonomous_single_stays_single':b'AUDIFY_V68161_AUTONOMOUS_SINGLE_STAYS_SINGLE',
              'release_preference_intelligence':b'AUDIFY_V68160_RELEASE_PREFERENCE_INTELLIGENCE',
              'single_to_canonical_album_promotion':b'AUDIFY_V68160_SINGLE_TO_CANONICAL_ALBUM_PROMOTION',
              'autonomous_single_guard':b'AUDIFY_V68160_AUTONOMOUS_SINGLE_GUARD',
              'artist_discography_proof':b'AUDIFY_V68160_ARTIST_DISCOGRAPHY_PROOF',
              'artist_identity_fusion':b'AUDIFY_V68159_ARTIST_IDENTITY_FUSION',
              'structured_video_title_proof':b'AUDIFY_V68159_STRUCTURED_VIDEO_TITLE_PROOF',
              'channel_alias_independence':b'AUDIFY_V68159_CHANNEL_ALIAS_INDEPENDENCE',
              'localized_official_metadata':b'AUDIFY_V68158_LOCALIZED_OFFICIAL_METADATA',
              'french_official_channel_normalization':b'AUDIFY_V68158_FRENCH_OFFICIAL_CHANNEL_NORMALIZATION',
              'raw_artist_canonicalization':b'AUDIFY_V68157_RAW_ARTIST_CANONICALIZATION',
              'structured_description_trust':b'AUDIFY_V68157_STRUCTURED_DESCRIPTION_TRUST',
              'official_metadata_identity':b'AUDIFY_V68156_OFFICIAL_METADATA_IDENTITY',
              'description_artist_proof':b'AUDIFY_V68156_DESCRIPTION_ARTIST_PROOF',
              'description_album_proof':b'AUDIFY_V68156_DESCRIPTION_ALBUM_PROOF',
              'deezer_canonical_album_crosscheck':b'AUDIFY_V68155_DEEZER_CANONICAL_ALBUM_CROSSCHECK',
              'deezer_tracklist_proof':b'AUDIFY_V68155_DEEZER_TRACKLIST_PROOF',
              'resolver_continuity':b'AUDIFY_V68154_RESOLVER_CONTINUITY',
              'playback_continuity':b'AUDIFY_V68154_PLAYBACK_CONTINUITY',
              'player_timestamps':b'AUDIFY_V68154_PLAYER_TIMESTAMPS',
              'ytmusic_primary_resolver':b'AUDIFY_V6815_YTMUSIC_PRIMARY_RESOLVER',
              'ytmusic_direct_album_relation':b'YTMUSIC_DIRECT_ALBUM_RELATION',
              'ytmusic_coherence_guard':b'AUDIFY_V68151_YTMUSIC_COHERENCE_GUARD',
              'ytmusic_session_stability':b'AUDIFY_V68152_YTMUSIC_SESSION_STABILITY',
              'canonical_artist_album_guard':b'AUDIFY_V68153_CANONICAL_ARTIST_ALBUM_GUARD',
              'no_persistent_album_cache':b'AUDIFY_V6815_NO_PERSISTENT_ALBUM_CACHE',
              'album_intelligence_2':b'AUDIFY_V6814_ALBUM_INTELLIGENCE_2',
              'album_recall_fix':b'AUDIFY_V68141_ALBUM_RECALL_FIX',
              'album_playlist_save_fix':b'AUDIFY_V68133_ALBUM_PLAYLIST_SAVE_FIX',
              'real_gradient_a_marker':b'AUDIFY_V6812652_EXACT_GRADIENT_A_SPLASH',
              'gradient_view':b'AudifyGradientMarkView',
              'clickable_album_tracks':b'audify-track-pending',
          }
          forbidden={
              'synthetic_album_fallback':'Autour de «'.encode(),
              'pulse_tagline':'VOTRE MUSIQUE PREND VIE'.encode(),
              'pulse_loading':'Préparation de votre musique'.encode(),
              'pulse_equalizer':b'EqualizerView',
              'pulse_ring':b'startRingPulse',
              'pulse_logo_shell':b'logoShell',
          }
          report={'version':'V68.16.6','bytes':os.path.getsize(p),'dex':dex}
          for k,v in required.items(): report[k]=v in all_dex
          for k,v in forbidden.items(): report[k]=v in all_dex
          missing=[k for k in required if not report[k]]
          bad=[k for k in forbidden if report[k]]
          if missing: raise SystemExit('Required Audify markers missing: '+', '.join(missing))
          if bad: raise SystemExit('Forbidden legacy behavior detected: '+', '.join(bad))
          print(json.dumps(report,indent=2,ensure_ascii=False))
          open('audify-android/releases/V68.16.6-FAST-PROOF-PIPELINE-REPORT.json','w').write(json.dumps(report,indent=2,ensure_ascii=False))
          PY

      - name: Upload V68.16.6 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Audify-V68.16.6-FAST-PROOF-PIPELINE-APK
          path: |
            audify-android/releases/Audify-V68.16.6-FAST-PROOF-PIPELINE.apk
            audify-android/releases/V68.16.6-FAST-PROOF-PIPELINE-REPORT.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish V68.16.6 APK in repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f audify-android/releases/Audify-V68.16.6-FAST-PROOF-PIPELINE.apk
          git add -f audify-android/releases/V68.16.6-FAST-PROOF-PIPELINE-REPORT.json
          if git diff --cached --quiet; then
            echo 'APK unchanged'
            exit 0
          fi
          git commit -m 'Publish Audify V68.16.6 Fast Proof Pipeline APK'
          git pull --rebase origin main
          git push origin HEAD:main
