name: Build Audify Android V68.12.5

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'audify/**'
      - 'audify-android/**'
      - '!audify-android/releases/**'
      - '.github/workflows/audify-android-build.yml'

permissions:
  contents: write

concurrency:
  group: audify-android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36"
      - name: Install Audify Android dependencies
        working-directory: audify-android
        run: npm install
      - name: Prepare Audify web UI
        working-directory: audify-android
        run: npm run prepare:web
      - name: Generate Capacitor Android project
        working-directory: audify-android
        run: npx cap add android
      - name: Sync Capacitor Android
        working-directory: audify-android
        run: npx cap sync android
      - name: Apply Audify native Media3 engine
        working-directory: audify-android
        env:
          AUDIFY_APPLE_AUTH_URL: ${{ secrets.AUDIFY_APPLE_AUTH_URL }}
          AUDIFY_APPLE_VERIFY_URL: ${{ secrets.AUDIFY_APPLE_VERIFY_URL }}
        run: npm run android:patch
      - name: Build debug APK
        working-directory: audify-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Prepare Audify V68.12.5 APK
        run: |
          mkdir -p audify-android/releases
          cp audify-android/android/app/build/outputs/apk/debug/app-debug.apk audify-android/releases/Audify-V68.12.5.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Audify-V68.12.5-APK
          path: audify-android/releases/Audify-V68.12.5.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK in repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f audify-android/releases/Audify-V68.12.5.apk
          if git diff --cached --quiet; then
            echo 'APK unchanged'
            exit 0
          fi
          git commit -m 'Publish Audify V68.12.5 APK'
          git pull --rebase origin main
          git push origin HEAD:main
