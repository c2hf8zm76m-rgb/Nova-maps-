name: Build Audify Android Background Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'audify/**'
      - 'audify-android/**'
      - '.github/workflows/audify-android-bg-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'audify/**'
      - 'audify-android/**'
      - '.github/workflows/audify-android-bg-test.yml'

concurrency:
  group: audify-android-bg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor
        working-directory: audify-android
        run: npm install

      - name: Prepare Audify WebView assets
        working-directory: audify-android
        run: npm run prepare:web

      - name: Generate Android project
        working-directory: audify-android
        run: npx cap add android

      - name: Sync Capacitor Android
        working-directory: audify-android
        run: npx cap sync android

      - name: Apply native background media patch
        working-directory: audify-android
        run: npm run android:patch

      - name: Build debug APK
        working-directory: audify-android
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Audify Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Audify-Android-Background-Test-APK
          path: audify-android/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
