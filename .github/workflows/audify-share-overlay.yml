name: Build Audify Share Overlay DEX

on:
  workflow_dispatch:
  push:
    paths:
      - 'audify-android/share-overlay/**'
      - 'audify/open.html'
      - '.github/workflows/audify-share-overlay.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform/build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile share + deep-link + audio-route overlay
        run: |
          set -euxo pipefail
          mkdir -p build/share/src/com/nova/audify build/share/classes build/share/dex
          cp audify-android/share-overlay/AudifyShareBootstrapProvider.java build/share/src/com/nova/audify/
          cp audify-android/share-overlay/AudifyDeepLinkBridge.java build/share/src/com/nova/audify/
          cp audify-android/share-overlay/AudifyAudioRouteIndicator.java build/share/src/com/nova/audify/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build/share/src/com/nova/audify/AudifyShareBootstrapProvider.java')
          s=p.read_text(encoding='utf-8')

          old='''        @Override public void onActivityResumed(Activity activity) {\n            if (activity == null || !PLAYER_CLASS.equals(activity.getClass().getName())) return;\n            try { installShareButton(activity); } catch (Throwable ignored) {}\n        }'''
          new='''        @Override public void onActivityResumed(Activity activity) {\n            if (activity == null) return;\n            try { AudifyDeepLinkBridge.handle(activity); } catch (Throwable ignored) {}\n            if (!PLAYER_CLASS.equals(activity.getClass().getName())) return;\n            try { installShareButton(activity); } catch (Throwable ignored) {}\n            try { AudifyAudioRouteIndicator.attach(activity); } catch (Throwable ignored) {}\n        }'''
          if old not in s: raise SystemExit('lifecycle patch target missing')
          s=s.replace(old,new,1)
          s=s.replace('''        @Override public void onActivityCreated(Activity a, Bundle b) {}''','''        @Override public void onActivityCreated(Activity a, Bundle b) { try { AudifyDeepLinkBridge.handle(a); } catch (Throwable ignored) {} }''',1)
          s=s.replace('''        @Override public void onActivityStarted(Activity a) {}''','''        @Override public void onActivityStarted(Activity a) { try { AudifyDeepLinkBridge.handle(a); } catch (Throwable ignored) {} }''',1)

          old='''        panel.addView(menuButton(activity, "Snapchat", "Partager une carte Audify dans Snapchat", () -> {'''
          s=s.replace(old,'''        panel.addView(menuButton(activity, "Snapchat", "Carte Audify + lien vers ce morceau", () -> {''',1)
          old='''        panel.addView(menuButton(activity, "Instagram Story", "Créer une Story avec la carte Audify", () -> {'''
          s=s.replace(old,'''        panel.addView(menuButton(activity, "Instagram Story", "Story + lien Audify prêt à coller", () -> {''',1)

          old='''        panel.addView(menuButton(activity, "Copier le texte", "Copier le titre et l’artiste", () -> {\n            copyShareText(activity, info);\n            dialog.dismiss();\n        }), spacedWrap(activity));'''
          new='''        panel.addView(menuButton(activity, "Copier le lien Audify", "Lien qui ouvre directement ce morceau dans Audify", () -> {\n            AudifyDeepLinkBridge.copyLink(activity, AudifyDeepLinkBridge.buildShareUrl(info.videoId, info.title, info.artist, info.thumbnail), true);\n            dialog.dismiss();\n        }), spacedWrap(activity));\n        panel.addView(menuButton(activity, "Copier le texte + lien", "Copier le titre, l’artiste et le lien Audify", () -> {\n            copyShareText(activity, info);\n            dialog.dismiss();\n        }), spacedWrap(activity));'''
          if old not in s: raise SystemExit('copy button patch target missing')
          s=s.replace(old,new,1)

          old='''        String caption = "🎧 J’écoute " + info.title + (TextUtils.isEmpty(info.artist) ? "" : " — " + info.artist) + " sur Audify";'''
          new='''        String shareUrl = AudifyDeepLinkBridge.buildShareUrl(info.videoId, info.title, info.artist, info.thumbnail);\n        String caption = "🎧 J’écoute " + info.title + (TextUtils.isEmpty(info.artist) ? "" : " — " + info.artist) + " sur Audify\\n" + shareUrl;'''
          if old not in s: raise SystemExit('caption patch target missing')
          s=s.replace(old,new,1)

          old='''                story.setPackage("com.instagram.android");\n                activity.grantUriPermission("com.instagram.android", uri, Intent.FLAG_GRANT_READ_URI_PERMISSION);\n                activity.startActivity(story);'''
          new='''                story.setPackage("com.instagram.android");\n                story.putExtra("source_application", activity.getPackageName());\n                story.putExtra("content_url", shareUrl);\n                activity.grantUriPermission("com.instagram.android", uri, Intent.FLAG_GRANT_READ_URI_PERMISSION);\n                AudifyDeepLinkBridge.copyLink(activity, shareUrl, false);\n                Toast.makeText(activity, "Lien Audify copié · dans Instagram ajoute le sticker Lien puis colle.", Toast.LENGTH_LONG).show();\n                activity.startActivity(story);'''
          if old not in s: raise SystemExit('instagram patch target missing')
          s=s.replace(old,new,1)

          old='''            String s = "🎧 " + info.title + (TextUtils.isEmpty(info.artist) ? "" : " — " + info.artist) + " · Audify";'''
          new='''            String s = "🎧 " + info.title + (TextUtils.isEmpty(info.artist) ? "" : " — " + info.artist) + " · Audify\\n" + AudifyDeepLinkBridge.buildShareUrl(info.videoId, info.title, info.artist, info.thumbnail);'''
          if old not in s: raise SystemExit('copy text patch target missing')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
          javac -source 8 -target 8 \
            -classpath "$ANDROID_SDK_ROOT/platforms/android-35/android.jar" \
            -d build/share/classes \
            build/share/src/com/nova/audify/AudifyShareBootstrapProvider.java \
            build/share/src/com/nova/audify/AudifyDeepLinkBridge.java \
            build/share/src/com/nova/audify/AudifyAudioRouteIndicator.java
          jar cf build/share/share-overlay.jar -C build/share/classes .
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/d8" \
            --min-api 23 \
            --output build/share/dex \
            build/share/share-overlay.jar
          test -s build/share/dex/classes.dex
          cp build/share/dex/classes.dex build/share/classes9.dex
          sha256sum build/share/classes9.dex
      - name: Package zipalign and apksigner
        run: |
          set -euxo pipefail
          mkdir -p build/share/tools/lib build/share/tools/lib64
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" build/share/tools/
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" build/share/tools/
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar" build/share/tools/lib/
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib64/libc++.so" build/share/tools/lib64/
          chmod +x build/share/tools/zipalign build/share/tools/apksigner
          LD_LIBRARY_PATH="$PWD/build/share/tools/lib64" build/share/tools/zipalign -h >/dev/null || true
      - name: Upload share overlay dex
        uses: actions/upload-artifact@v4
        with:
          name: AudifyShareOverlay-DEX
          path: build/share/classes9.dex
          if-no-files-found: error
          retention-days: 7
      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: AudifyAndroidSigningTools
          path: build/share/tools
          if-no-files-found: error
          retention-days: 7
