<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#070a0f">
  <title>Audify V67 • Clean Boot</title>
  <style>
    html,body{margin:0;min-height:100%;background:#070a0f;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
    #audifyBoot{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:#070a0f;transition:opacity .28s ease,visibility .28s ease}
    #audifyBoot.done{opacity:0;visibility:hidden;pointer-events:none}
    .bootCard{text-align:center;padding:24px}.bootA{font-size:58px;font-weight:950;letter-spacing:-.08em}.bootText{margin-top:10px;color:#aeb7c5;font-size:14px}
    #audifyBootError{display:none;margin-top:14px;max-width:620px;color:#ffb9b9;font-size:12px;white-space:pre-wrap}
  </style>
</head>
<body>
<div id="audifyBoot"><div class="bootCard"><div class="bootA">A</div><div class="bootText">Chargement d’Audify…</div><div id="audifyBootError"></div></div></div>
<script>
(async()=>{
  'use strict';
  const VERSION='67';
  const stamp='20260830-67';
  const css=['v22-patch.css','v23-patch.css','v24-patch.css','v25-patch.css','v26-patch.css','v27-patch.css','v28-patch.css','v29-patch.css','v30-patch.css','v31-patch.css','v32-patch.css','v33-patch.css','v34-patch.css','v35-patch.css','v36-patch.css','v37-patch.css','v38-patch.css','v39-patch.css','v40-patch.css','v41-patch.css','v42-patch.css','v43-patch.css','v44-patch.css','v45-patch.css','v46-patch.css','v47-patch.css','v48-patch.css','v49-patch.css','v50-patch.css','v51-patch.css','v52-patch.css','v53-patch.css','v54-patch.css','v55-patch.css','v56-patch.css','v57-patch.css','v58-patch.css','v59-patch.css','v60-patch.css','v61-patch.css','v62-patch.css','v63-patch.css','v64-patch.css','v65-patch.css','v66-patch.css'];
  const js=['v22-patch.js','v23-patch.js','v24-patch.js','v25-patch.js','v26-patch.js','v27-patch.js','v28-patch.js','v29-patch.js','v30-patch.js','v31-patch.js','v32-patch.js','v33-patch.js','v34-patch.js','v35-patch.js','v36-patch.js','v37-patch.js','v38-patch.js','v39-patch.js','v40-patch.js','v41-patch.js','v42-patch.js','v43-patch.js','v44-patch.js','v45-patch.js','v46-patch.js','v47-patch.js','v48-patch.js','v49-patch.js','v50-patch.js','v51-patch.js','v52-patch.js','v53-patch.js','v54-patch.js','v55-patch.js','v56-patch.js','v57-patch.js','v58-patch.js','v59-patch.js','v60-patch.js','v61-patch.js','v62-patch.js','v63-patch.js','v64-patch.js','v65-patch.js','google-sync-config.js','v66-patch.js'];
  const errEl=document.getElementById('audifyBootError');
  const fail=(e)=>{console.error('[Audify V67 boot]',e);errEl.style.display='block';errEl.textContent='Erreur de démarrage Audify V67 : '+(e&&e.message?e.message:String(e));};
  const timeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error('délai de démarrage dépassé')),12000));
  try{
    if('serviceWorker' in navigator){
      try{const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs){if(r.active&&/sw-v61\.js/.test(r.active.scriptURL))await r.unregister();}}catch(e){console.warn('SW cleanup',e)}
    }
    const html=await Promise.race([fetch('./index-v21.html?v='+stamp,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('index-v21 '+r.status);return r.text()}),timeout]);
    const doc=new DOMParser().parseFromString(html,'text/html');
    doc.querySelectorAll('script[src*="youtube.com/iframe_api"]').forEach(n=>n.remove());
    document.title='Audify V67 • Clean Boot';
    document.body.innerHTML=doc.body.innerHTML;
    for(const node of [...doc.head.children]){
      if(node.tagName==='STYLE')document.head.appendChild(node.cloneNode(true));
    }
    for(const href of css){const l=document.createElement('link');l.rel='stylesheet';l.href='./'+href+'?v='+stamp;document.head.appendChild(l);}
    const loadScript=(src)=>new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='./'+src+'?v='+stamp;s.async=false;s.onload=resolve;s.onerror=()=>reject(new Error('échec '+src));document.body.appendChild(s);});
    const baseScripts=[...doc.querySelectorAll('script[src]')].map(s=>s.getAttribute('src')).filter(Boolean).filter(src=>!src.includes('youtube.com/iframe_api'));
    for(const src of baseScripts){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.async=false;s.onload=resolve;s.onerror=()=>reject(new Error('échec '+src));document.body.appendChild(s);});}
    for(const src of js)await loadScript(src);
    window.AUDIFY_VERSION=VERSION;
    window.dispatchEvent(new CustomEvent('audify:v67-ready'));
    setTimeout(()=>document.getElementById('audifyBoot')?.classList.add('done'),120);
    if(!window.YT){const yt=document.createElement('script');yt.src='https://www.youtube.com/iframe_api';yt.async=true;yt.onerror=()=>console.warn('YouTube iframe API indisponible');document.head.appendChild(yt);}
  }catch(e){fail(e)}
})();
</script>
</body>
</html>
