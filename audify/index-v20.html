<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Audify V20 - Glass Morph</title>
<script src="https://www.youtube.com/iframe_api"></script>
<style>
:root{--bg:#070a0f;--text:#f4f6fb;--muted:#b3bcc9;--accent:#a8ff3f;--accent2:#91f42d;--ambient:#1a212c;--ambient2:#33424e}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font:14px/1.4 Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);background:var(--bg);overflow-x:hidden}
button,input{font:inherit;color:inherit}button{cursor:pointer}
body::before{content:"";position:fixed;inset:-10%;z-index:-3;background:radial-gradient(circle at 50% 34%,rgba(255,255,255,.08),transparent 20%),radial-gradient(circle at 50% 40%,var(--ambient2) 0%,var(--ambient) 36%,#0a0d12 82%);transition:background .6s ease,filter .6s ease;filter:saturate(1.15) blur(0)}
body::after{content:"";position:fixed;inset:0;z-index:-2;background:linear-gradient(to bottom,rgba(8,11,16,.08),rgba(8,11,16,.26) 34%,rgba(8,11,16,.54) 68%,rgba(8,11,16,.78) 100%)}
.search-wrap{position:fixed;top:16px;left:50%;transform:translateX(-50%);width:min(920px,calc(100vw - 26px));z-index:20}.search{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.17);background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.05));box-shadow:0 24px 70px rgba(0,0,0,.33),inset 0 1px 0 rgba(255,255,255,.12),inset 0 -1px 0 rgba(255,255,255,.04);backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:10px 0;color:#fff;font-size:15px}.search input::placeholder{color:rgba(230,236,244,.52)}.search button{border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:11px 24px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#081006;font-weight:900;box-shadow:0 12px 32px rgba(168,255,63,.18),inset 0 1px 0 rgba(255,255,255,.38)}
main{min-height:100vh}.results-view{max-width:1300px;margin:auto;padding:110px 24px 140px}.empty{text-align:center;color:var(--muted);padding:60px 20px;border:1px dashed rgba(255,255,255,.14);border-radius:24px;background:rgba(255,255,255,.03);backdrop-filter:blur(8px)}.results{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card{padding:10px;border-radius:22px;border:1px solid rgba(255,255,255,.1);background:linear-gradient(155deg,rgba(18,24,33,.8),rgba(10,14,20,.72));box-shadow:0 18px 48px rgba(0,0,0,.28);backdrop-filter:blur(18px);overflow:hidden;transition:.28s ease}.card:hover{transform:translateY(-8px);border-color:rgba(168,255,63,.36);box-shadow:0 26px 72px rgba(0,0,0,.4),0 0 28px rgba(168,255,63,.06)}.card img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:16px;display:block}.meta{padding:12px 4px 9px}.meta b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:15px}.meta span{display:block;margin-top:6px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}.card button{width:100%;border:0;border-radius:14px;padding:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#081006;font-weight:900}
.player-view{min-height:100vh;padding:102px 22px max(120px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;justify-content:flex-start;position:relative;overflow:hidden}.player-view[hidden]{display:none}
.waves{position:absolute;left:50%;top:39%;transform:translate(-50%,-50%);width:min(1500px,145vw);height:300px;opacity:.92;pointer-events:none;z-index:0;mix-blend-mode:screen}.waves svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.waves path{fill:none;stroke-linecap:round;stroke-linejoin:round}.w1 path{stroke:rgba(245,249,255,.34);stroke-width:3}.w2 path{stroke:rgba(208,229,255,.27);stroke-width:2.5}.w3 path{stroke:rgba(150,210,255,.21);stroke-width:2.1}.w4 path{stroke:rgba(255,255,255,.14);stroke-width:1.5}.playing .w1{animation:f1 8s ease-in-out infinite alternate}.playing .w2{animation:f2 10.8s ease-in-out infinite alternate}.playing .w3{animation:f3 9.4s ease-in-out infinite alternate}.playing .w4{animation:f4 12.5s ease-in-out infinite alternate}@keyframes f1{0%{transform:translate(-18px,-8px) scaleY(.96)}50%{transform:translate(10px,8px) scaleY(1.04)}100%{transform:translate(22px,-3px) scaleY(.98)}}@keyframes f2{0%{transform:translate(20px,10px) scaleY(1.05)}50%{transform:translate(-8px,-8px) scaleY(.95)}100%{transform:translate(-22px,8px) scaleY(1.03)}}@keyframes f3{0%{transform:translate(-12px,10px) scaleY(1.07)}50%{transform:translate(10px,-10px) scaleY(.93)}100%{transform:translate(16px,5px) scaleY(1.01)}}@keyframes f4{0%{transform:translate(15px,-10px) scaleY(.97)}50%{transform:translate(-15px,10px) scaleY(1.06)}100%{transform:translate(-4px,-5px) scaleY(.99)}}
.stage{position:relative;z-index:3;width:min(600px,80vw);height:min(420px,56vw);display:flex;align-items:center;justify-content:center;margin-top:18px;animation:appear .65s cubic-bezier(.2,.9,.24,1.12)}@keyframes appear{from{opacity:0;transform:translateY(36px) scale(.82)}}.vinyl{position:absolute;width:min(360px,41vw);height:min(360px,41vw);border-radius:50%;transform:translateX(28%);background:repeating-radial-gradient(circle,#040506 0 8px,#1d232d 9px 16px,#090b0d 17px 25px);box-shadow:0 36px 100px rgba(0,0,0,.62);animation:spin 3.4s linear infinite;animation-play-state:paused}.playing .vinyl{animation-play-state:running}@keyframes spin{to{transform:translateX(28%) rotate(360deg)}}.vinyl::after{content:"";position:absolute;left:50%;top:50%;width:13px;height:13px;border-radius:50%;background:#fff;transform:translate(-50%,-50%)}.vlabel{position:absolute;inset:31%;border-radius:50%;background:center/cover no-repeat;border:7px solid #090b0d}.cover{position:relative;z-index:2;width:min(310px,39vw);height:min(310px,39vw);transform:translateX(-10%);border-radius:28px;background:#131820 center/cover no-repeat;box-shadow:0 36px 96px rgba(0,0,0,.68);border:1px solid rgba(255,255,255,.16);overflow:hidden}.cover::before{content:"";position:absolute;inset:0;background:linear-gradient(125deg,rgba(255,255,255,.12),transparent 32%,transparent 70%,rgba(255,255,255,.03))}
.copy{position:relative;z-index:3;max-width:min(920px,92vw);text-align:center;margin-top:12px}.copy h1{margin:0;line-height:1.03;letter-spacing:-.04em;font-weight:900;text-wrap:balance;text-shadow:0 8px 26px rgba(0,0,0,.22)}.copy h1.xl{font-size:clamp(34px,5vw,60px)}.copy h1.lg{font-size:clamp(31px,4.4vw,53px)}.copy h1.md{font-size:clamp(27px,3.8vw,45px)}.copy h1.sm{font-size:clamp(23px,3.2vw,37px)}.copy h1.xs{font-size:clamp(20px,2.8vw,31px)}.copy p{margin:12px 0 0;color:rgba(239,243,249,.72);font-size:clamp(15px,1.7vw,21px)}
.player{position:relative;z-index:4;margin-top:auto;margin-bottom:16px;width:min(840px,92vw);display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:15px 16px;border-radius:30px;border:1px solid rgba(255,255,255,.16);background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.045));box-shadow:0 26px 80px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.11),inset 0 -1px 0 rgba(255,255,255,.03);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%)}.player::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(120deg,rgba(255,255,255,.08),transparent 26%,transparent 73%,rgba(255,255,255,.03));pointer-events:none}.cluster,.actions{display:flex;align-items:center;gap:10px;position:relative;z-index:1}.well,.timeline,.vol-shell,.video-btn{border:1px solid rgba(255,255,255,.1);background:linear-gradient(140deg,rgba(255,255,255,.08),rgba(255,255,255,.03));box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}.well{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:999px}.nav,.play-btn{border:0;display:grid;place-items:center}.nav{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.03)}.play-btn{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,rgba(255,255,255,.98),rgba(235,240,248,.92));color:#070b10;font-weight:900;box-shadow:0 10px 28px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.74)}.timeline{display:grid;grid-template-columns:44px 1fr 44px;gap:10px;align-items:center;padding:13px 14px;border-radius:22px;min-width:0}.timeline span{font-size:12px;color:rgba(236,241,248,.76)}input[type=range]{width:100%;accent-color:var(--accent)}.actions{justify-self:end}.video-btn{padding:11px 18px;border-radius:18px;color:#fff;font-weight:700;min-width:140px}.vol-shell{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:18px;min-width:128px}
.video{position:fixed;right:14px;bottom:106px;width:150px;height:150px;z-index:30;border-radius:17px;border:1px solid rgba(255,255,255,.14);background:linear-gradient(135deg,rgba(20,26,34,.9),rgba(8,11,16,.96));box-shadow:0 24px 70px rgba(0,0,0,.46);backdrop-filter:blur(18px);overflow:hidden;display:none}.video.show{display:block}.vhead{height:24px;padding:0 8px;display:flex;align-items:center;justify-content:space-between;color:#9ca7b5;font-size:10px;background:rgba(255,255,255,.03)}.vhead button{border:0;background:transparent;color:#c0c8d2;font-size:18px}.video iframe,#yt{display:block;width:124px!important;height:124px!important;margin:auto}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(16px);opacity:0;pointer-events:none;background:#fff;color:#070b10;padding:10px 14px;border-radius:999px;font-weight:700;z-index:40;transition:.22s ease}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:980px){.results{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:760px){.search-wrap{top:10px;width:calc(100vw - 18px)}.search button{padding:10px 14px}.results-view{padding:82px 10px 120px}.results{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.player-view{padding:84px 10px max(136px,env(safe-area-inset-bottom));}.waves{top:34%;width:176vw;height:230px}.stage{width:94vw;height:66vw;margin-top:34px}.cover{width:55vw;height:55vw}.vinyl{width:53vw;height:53vw}.copy{margin-top:8px}.player{width:calc(100vw - 18px);grid-template-columns:1fr;gap:10px;padding:12px 12px 13px;margin-top:auto;margin-bottom:26px;border-radius:28px}.cluster,.actions{justify-content:center}.timeline{grid-template-columns:38px 1fr 38px;padding:12px 12px}.video-btn{flex:1;min-width:0}.vol-shell{display:none}.video{bottom:114px}}@media(max-width:520px){.results{grid-template-columns:1fr}.card{display:grid;grid-template-columns:105px 1fr;grid-template-rows:auto auto}.card img{grid-row:1/3}.meta{padding:8px 10px}.card button{align-self:end}.copy h1.xl{font-size:48px}.copy h1.lg{font-size:42px}.copy h1.md{font-size:36px}.copy h1.sm{font-size:31px}.copy h1.xs{font-size:26px}}
</style>
</head>
<body>
<header class="search-wrap"><div class="search"><span>⌕</span><input id="q" autocomplete="off" inputmode="search" placeholder="Rechercher un artiste ou un titre…"><button id="go">Rechercher</button></div></header>
<main>
<section id="resultsView" class="results-view"><div id="results" class="empty">Recherche une musique pour commencer.</div></section>
<section id="playerView" class="player-view" hidden>
<div class="waves"><svg class="w1" viewBox="0 0 1600 260" preserveAspectRatio="none"><path d="M-120 140 C 40 20 190 240 360 130 S 690 35 850 135 S 1160 230 1320 120 S 1550 35 1720 140"/></svg><svg class="w2" viewBox="0 0 1600 260" preserveAspectRatio="none"><path d="M-120 120 C 70 210 220 35 390 125 S 690 215 860 120 S 1180 35 1350 125 S 1580 210 1720 120"/></svg><svg class="w3" viewBox="0 0 1600 260" preserveAspectRatio="none"><path d="M-120 150 C 80 90 230 205 410 145 S 730 88 900 148 S 1210 205 1380 145 S 1600 90 1730 150"/></svg><svg class="w4" viewBox="0 0 1600 260" preserveAspectRatio="none"><path d="M-120 105 C 20 5 210 250 400 110 S 720 10 900 110 S 1220 245 1410 105 S 1610 10 1740 110"/></svg></div>
<div class="stage"><div class="vinyl"><div id="vlabel" class="vlabel"></div></div><div id="cover" class="cover"></div></div>
<div class="copy"><h1 id="title" class="xl">Aucun titre</h1><p id="artist">—</p></div>
<div class="player"><div class="cluster"><div class="well"><button id="prev" class="nav">◀</button><button id="play" class="play-btn">▶</button><button id="next" class="nav">▶</button></div></div><div class="timeline"><span id="ct">0:00</span><input id="prog" type="range" min="0" max="1000" value="0"><span id="dur">0:00</span></div><div class="actions"><button id="videoBtn" class="video-btn">▣ Vidéo</button><div class="vol-shell"><span>🔊</span><input id="vol" type="range" min="0" max="100" value="80"></div></div></div>
</section>
</main>
<aside id="video" class="video"><div class="vhead"><span>YouTube</span><button id="closeVideo">×</button></div><div id="yt"></div></aside>
<div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const KEY='AIzaSyDY2Lz5pnOkpwYuMN03DbkYtU4XJTACcJQ';
const S={p:null,ready:false,items:[],i:-1,current:null};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[m]));
const fmt=n=>{n=Math.max(0,Math.floor(n||0));return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')};
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1600)};
const directId=v=>{const m=String(v).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([\w-]{11})/);return m?.[1]||(/^[\w-]{11}$/.test(String(v))?String(v):null)};
function applyTitleSize(t){const e=$('#title'),n=String(t||'').trim().length;e.className='';e.classList.add(n<=20?'xl':n<=34?'lg':n<=48?'md':n<=64?'sm':'xs')}
function fallback(seed){let h=0;for(const c of String(seed||''))h=(h*31+c.charCodeAt(0))>>>0;return `hsl(${h%360} 35% 24%)`}
function lighter(rgb){const m=String(rgb).match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/);if(!m)return rgb;const [r,g,b]=m.slice(1).map(Number).map(v=>Math.min(255,Math.round(v*1.28+18)));return `rgb(${r}, ${g}, ${b})`}
function setAmbient(url,seed){const img=new Image();img.crossOrigin='anonymous';img.referrerPolicy='no-referrer';img.onload=()=>{try{const c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});c.width=36;c.height=24;x.drawImage(img,0,0,36,24);const d=x.getImageData(0,0,36,24).data,bins=new Map();for(let i=0;i<d.length;i+=4){let r=d[i],g=d[i+1],b=d[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b),lum=(r+g+b)/3,sat=mx-mn;if(lum<25||lum>235||sat<16)continue;r=Math.round(r/32)*32;g=Math.round(g/32)*32;b=Math.round(b/32)*32;const k=`${r},${g},${b}`;bins.set(k,(bins.get(k)||0)+1+sat/100)}const best=[...bins.entries()].sort((a,b)=>b[1]-a[1])[0];const col=best?`rgb(${best[0]})`:fallback(seed);document.documentElement.style.setProperty('--ambient',col);document.documentElement.style.setProperty('--ambient2',lighter(col))}catch{const col=fallback(seed);document.documentElement.style.setProperty('--ambient',col);document.documentElement.style.setProperty('--ambient2',col)}};img.onerror=()=>{const col=fallback(seed);document.documentElement.style.setProperty('--ambient',col);document.documentElement.style.setProperty('--ambient2',col)};img.src=url}
window.onYouTubeIframeAPIReady=()=>{S.p=new YT.Player('yt',{width:124,height:124,playerVars:{playsinline:1,controls:0,cc_load_policy:0,fs:0,disablekb:1,iv_load_policy:3,rel:0,enablejsapi:1,origin:location.origin},events:{onReady:()=>{S.ready=true;S.p.setVolume(80)},onStateChange:e=>{const v=$('#playerView');if(e.data===YT.PlayerState.PLAYING){v.classList.add('playing');$('#play').textContent='❚❚'}if(e.data===YT.PlayerState.PAUSED||e.data===YT.PlayerState.CUED){v.classList.remove('playing');$('#play').textContent='▶'}if(e.data===YT.PlayerState.ENDED){v.classList.remove('playing');nextTrack()}}}})};
setInterval(()=>{if(!S.ready||!S.current)return;const d=S.p.getDuration()||0,c=S.p.getCurrentTime()||0;$('#ct').textContent=fmt(c);$('#dur').textContent=fmt(d);$('#prog').value=d?Math.round(c/d*1000):0},350);
function renderResults(items){S.items=items;S.i=-1;$('#playerView').hidden=true;$('#resultsView').hidden=false;const r=$('#results');if(!items.length){r.className='empty';r.textContent='Aucun résultat.';return}r.className='results';r.innerHTML=items.map((t,i)=>`<article class="card"><img src="${esc(t.thumbnail)}" alt="${esc(t.title)}"><div class="meta"><b>${esc(t.title)}</b><span>${esc(t.artist)}</span></div><button data-p="${i}">▶ Lire</button></article>`).join('');$$('[data-p]').forEach(b=>b.onclick=()=>playTrack(items[+b.dataset.p],+b.dataset.p))}
async function search(){const q=$('#q').value.trim();if(!q)return;const r=$('#results');$('#resultsView').hidden=false;$('#playerView').hidden=true;r.className='empty';r.textContent='Recherche…';const id=directId(q);if(id){renderResults([{id,title:'Vidéo YouTube',artist:'YouTube',thumbnail:`https://i.ytimg.com/vi/${id}/hqdefault.jpg`}]);return}try{const u=new URL('https://www.googleapis.com/youtube/v3/search');for(const [k,v] of Object.entries({part:'snippet',type:'video',videoEmbeddable:'true',maxResults:'20',q,key:KEY}))u.searchParams.set(k,v);const res=await fetch(u.toString(),{headers:{accept:'application/json'}});const data=await res.json();if(!res.ok)throw new Error(data?.error?.message||`YouTube API HTTP ${res.status}`);const items=(data.items||[]).map(x=>({id:x?.id?.videoId,title:x?.snippet?.title||'Sans titre',artist:x?.snippet?.channelTitle||'YouTube',thumbnail:x?.snippet?.thumbnails?.high?.url||x?.snippet?.thumbnails?.medium?.url||x?.snippet?.thumbnails?.default?.url})).filter(x=>x.id);renderResults(items)}catch(e){r.className='empty';r.innerHTML='<b>Erreur de recherche YouTube</b><br><br>'+esc(e?.message||String(e))}}
function playTrack(t,i=-1){S.current=t;if(i>=0)S.i=i;$('#resultsView').hidden=true;$('#playerView').hidden=false;$('#title').textContent=t.title;applyTitleSize(t.title);$('#artist').textContent=t.artist;$('#cover').style.backgroundImage=`url("${String(t.thumbnail).replace(/"/g,'')}")`;$('#vlabel').style.backgroundImage=`url("${String(t.thumbnail).replace(/"/g,'')}")`;setAmbient(t.thumbnail,t.id||t.title);$('#video').classList.add('show');const load=()=>S.ready?S.p.loadVideoById(t.id):setTimeout(load,100);load()}
function nextTrack(){if(!S.items.length)return;const i=S.i<0?0:(S.i+1)%S.items.length;playTrack(S.items[i],i)}
function prevTrack(){if(!S.items.length){if(S.ready)S.p.seekTo(0,true);return}const i=S.i<=0?S.items.length-1:S.i-1;playTrack(S.items[i],i)}
$('#go').onclick=search;$('#q').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();search()}};$('#play').onclick=()=>{if(!S.current)return toast('Choisis une musique');S.p.getPlayerState()===YT.PlayerState.PLAYING?S.p.pauseVideo():S.p.playVideo()};$('#prev').onclick=prevTrack;$('#next').onclick=nextTrack;$('#prog').oninput=e=>{if(S.ready)S.p.seekTo((S.p.getDuration()||0)*(+e.target.value/1000),true)};$('#vol').oninput=e=>S.ready&&S.p.setVolume(+e.target.value);$('#videoBtn').onclick=()=>$('#video').classList.toggle('show');$('#closeVideo').onclick=()=>$('#video').classList.remove('show');
</script>
</body>
</html>
