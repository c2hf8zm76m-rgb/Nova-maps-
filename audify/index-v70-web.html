<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0908">
<title>Audify Web V70.4.2</title>
<style>
:root{--bg:#080a0e;--panel:#12161dcc;--line:#ffffff1a;--text:#f7f8fb;--muted:#a8afba;--accent:#f5f7fb;--ambient:#6b4528;--ambient-rgb:107,69,40}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07090d;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit}.app-shell{min-height:100vh;background:radial-gradient(circle at 75% -10%,#283326 0,transparent 32%),linear-gradient(#0a0d12,#06080b)}
.top{position:sticky;top:0;z-index:20;padding:14px 14px 10px;background:#090c11dd;backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.bar{max-width:1120px;margin:auto;display:flex;gap:10px;align-items:center}.brand{display:flex;align-items:center;gap:10px;min-width:max-content;font-weight:900;letter-spacing:.01em}.brand-wave{display:flex;align-items:center;gap:3px;height:32px}.brand-wave i{display:block;width:3px;border-radius:9px;background:#d9ab75}.brand-wave i:nth-child(1),.brand-wave i:nth-child(5){height:13px}.brand-wave i:nth-child(2),.brand-wave i:nth-child(4){height:24px}.brand-wave i:nth-child(3){height:34px}.search{flex:1;display:flex;gap:8px;padding:6px;border:1px solid var(--line);border-radius:18px;background:#ffffff08}.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#fff;padding:10px 12px}.search button,.primary{border:0;border-radius:13px;background:#f5f7fb;color:#090c11;font-weight:900;padding:10px 15px}.tabs{max-width:1120px;margin:10px auto 0;display:flex;gap:7px;overflow:auto;scrollbar-width:none}.tabs button{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:8px 13px;background:#ffffff07;color:#dce2eb}.tabs button.on{background:#ffffff15;border-color:#ffffff30;color:#fff}.wrap{max-width:1120px;margin:auto;padding:24px 14px 120px}.hero{padding:22px;border:1px solid var(--line);border-radius:26px;background:linear-gradient(145deg,#ffffff0d,#ffffff04);margin-bottom:20px}.hero small{color:#d9ab75;font-weight:900;letter-spacing:.13em}.hero h1{font-size:clamp(26px,5vw,46px);margin:8px 0 5px}.hero p{margin:0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{min-width:0;padding:9px;border:1px solid var(--line);border-radius:21px;background:#0e131acc;transition:.18s transform,.18s border-color,.18s background}.card:hover{transform:translateY(-3px);border-color:#ffffff2f;background:#121821}.coverBtn{display:block;width:100%;padding:0;border:0;background:none;text-align:left}.card img,.cover-fallback{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:15px;background:#151b24}.cover-fallback{display:grid;place-items:center;font-size:44px}.card b,.card span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card b{margin-top:10px}.card span{color:var(--muted);font-size:12px;margin:4px 0 9px}.card .row{display:grid;grid-template-columns:1fr 44px;gap:7px}.card .row button{border:0;border-radius:12px;padding:10px;background:#ffffff0c}.card .play{background:#f5f7fb!important;color:#090c11!important;font-weight:900}.empty{padding:48px 18px;text-align:center;border:1px dashed #ffffff20;border-radius:20px;color:var(--muted)}.section-title{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 13px}.section-title h2{margin:0;font-size:20px}.queue{margin-top:16px;display:grid;gap:8px}.line{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:15px;background:#ffffff06}.line img{width:48px;height:48px;object-fit:cover;border-radius:10px}.line b,.line span{display:block}.line span{font-size:11px;color:var(--muted)}.line button{border:0;border-radius:10px;padding:9px;background:#ffffff0b}.mini-player{position:fixed;z-index:40;left:50%;bottom:12px;transform:translateX(-50%);width:min(900px,calc(100% - 18px));padding:9px;border:1px solid #ffffff22;border-radius:20px;background:#0b1018e8;backdrop-filter:blur(24px);box-shadow:0 20px 60px #0009;display:none;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:center}.mini-player.show{display:grid}.mini-player img{width:56px;height:56px;object-fit:cover;border-radius:13px}.mini-now{min-width:0}.mini-now b,.mini-now span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini-now span{font-size:11px;color:var(--muted);margin-top:3px}.mini-controls{display:flex;gap:6px}.mini-controls button{width:42px;height:42px;border:1px solid var(--line);border-radius:13px;background:#ffffff0b}.mini-controls .big{background:#f5f7fb;color:#090c11;font-weight:950}.toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,12px);opacity:0;pointer-events:none;z-index:120;padding:10px 14px;border-radius:999px;background:#fff;color:#080b10;font-weight:800;transition:.2s;box-shadow:0 10px 35px #0007}.toast.show{opacity:1;transform:translate(-50%,0)}
.player-screen{position:fixed;inset:0;z-index:100;display:none;overflow:auto;background:#0a0908;color:#fff}.player-screen.open{display:block}.ambient-bg{position:fixed;inset:-40px;z-index:-3;background:radial-gradient(circle at 55% 22%,rgba(var(--ambient-rgb),.92) 0%,rgba(var(--ambient-rgb),.52) 28%,rgba(10,8,7,.94) 68%,#050505 100%);transition:background .45s ease}.ambient-art{position:fixed;inset:-12%;z-index:-4;background-size:cover;background-position:center;filter:blur(80px) saturate(.8);opacity:.38;transform:scale(1.12)}.ambient-vignette{position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,.2) 62%,rgba(0,0,0,.78) 100%),linear-gradient(to bottom,rgba(0,0,0,.04),rgba(0,0,0,.52));pointer-events:none}.player-page{width:min(980px,100%);min-height:100%;margin:auto;padding:20px 22px 42px}.player-head{display:flex;align-items:center;justify-content:space-between;gap:14px}.player-brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:900}.head-actions{display:flex;gap:10px}.icon-btn{width:58px;height:58px;border:1px solid #ffffff30;border-radius:20px;background:#1313137a;backdrop-filter:blur(16px);display:grid;place-items:center;font-size:25px;box-shadow:inset 0 1px #ffffff12,0 8px 28px #0004}.icon-btn.active{background:#f5f7fb;color:#111;border-color:#fff}.album-stage{position:relative;width:min(620px,78vw);margin:72px auto 34px;aspect-ratio:1}.vinyl{position:absolute;width:82%;aspect-ratio:1;border-radius:50%;right:-24%;top:9%;background:repeating-radial-gradient(circle at center,#0b0b0b 0 2px,#161616 3px 5px,#0b0b0b 6px 8px);border:2px solid #77808a;box-shadow:0 22px 40px #0009;transition:transform .5s ease}.vinyl::before{content:"";position:absolute;inset:36%;border-radius:50%;background:var(--vinyl-label,linear-gradient(145deg,#61432c,#1d1611));background-size:cover;background-position:center;box-shadow:inset 0 0 0 5px #0e0e0e}.vinyl::after{content:"";position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;background:#0c0c0c;transform:translate(-50%,-50%)}.vinyl.spinning{animation:spin 8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.album-sleeve{position:absolute;inset:0;z-index:2;border-radius:34px;overflow:hidden;background:#111;border:1px solid #ffffff25;box-shadow:0 28px 65px #000b}.album-sleeve img{width:100%;height:100%;object-fit:cover;display:block}.track-meta{text-align:center;margin:0 auto 28px;max-width:760px}.track-meta h1{font-size:clamp(30px,5vw,52px);line-height:1.05;margin:0 0 8px;text-shadow:0 2px 20px #0007}.track-meta p{font-size:clamp(16px,2.5vw,23px);color:#e2ded9aa;margin:0}.control-panel{max-width:820px;margin:auto;padding:18px;border:1px solid #ffffff20;border-radius:34px;background:linear-gradient(160deg,#171717d6,#0c0c0ce6);backdrop-filter:blur(24px);box-shadow:inset 0 1px #ffffff10,0 28px 70px #0007}.control-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}.action{display:flex;flex-direction:column;align-items:center;gap:8px}.round{width:74px;height:74px;border:1px solid #ffffff2f;border-radius:50%;background:#121212b8;display:grid;place-items:center;font-size:31px}.round.play-main{width:92px;height:92px;background:#f7f8fb;color:#0a0a0a;font-size:37px;box-shadow:0 0 0 2px #ffffff55,0 10px 35px #0008}.round.active{background:#f5f7fb;color:#101010}.action label{font-size:13px;color:#eee}.progress-wrap{margin:22px 0 14px;padding:14px 15px;border:1px solid #ffffff18;border-radius:21px;background:#0d0d0d87;display:grid;grid-template-columns:50px 1fr 50px;gap:12px;align-items:center}.progress-wrap span{font-variant-numeric:tabular-nums;font-weight:700;color:#e5e7eb}.progress-wrap span:last-child{text-align:right}.seek{appearance:none;width:100%;height:4px;border-radius:999px;background:linear-gradient(to right,#fff 0 var(--seek,0%),#ffffff1c var(--seek,0%) 100%);outline:0}.seek::-webkit-slider-thumb{appearance:none;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 5px #0008}.playlist-bar{width:100%;display:flex;align-items:center;gap:12px;padding:15px 17px;border:1px solid #ffffff18;border-radius:21px;background:#1010108e;text-align:left}.playlist-bar .note{font-size:25px}.playlist-bar strong{font-size:16px}.playlist-bar .chev{margin-left:auto;font-size:25px;color:#ffffffaa}.karaoke-sheet{display:none;margin-top:14px;padding:18px;border:1px solid #ffffff20;border-radius:24px;background:#0b0b0bcf;text-align:center;color:#ddd}.karaoke-sheet.show{display:block}.karaoke-sheet b{display:block;margin-bottom:6px;color:#fff}
@media(max-width:850px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:640px){.brand span{display:none}.grid{grid-template-columns:repeat(2,1fr)}.mini-player{grid-template-columns:48px minmax(0,1fr) auto}.mini-player img{width:48px;height:48px}.mini-controls #prev,.mini-controls #next{display:none}.player-page{padding:12px 14px 32px}.player-brand{font-size:18px}.head-actions{gap:8px}.icon-btn{width:52px;height:52px;border-radius:18px}.album-stage{width:min(76vw,430px);margin-top:70px;margin-bottom:28px}.album-sleeve{border-radius:26px}.control-panel{border-radius:30px;padding:15px}.control-row{gap:7px}.round{width:58px;height:58px;font-size:25px}.round.play-main{width:76px;height:76px;font-size:31px}.action label{font-size:11px}.progress-wrap{grid-template-columns:44px 1fr 44px;gap:8px;padding:13px 12px}.player-head{align-items:flex-start}.player-brand{padding-top:10px}}
@media(max-width:370px){.grid{grid-template-columns:1fr}.round{width:52px;height:52px}.round.play-main{width:70px;height:70px}.album-stage{width:74vw}.icon-btn{width:48px;height:48px}.player-brand span{display:none}}
</style>
</head>
<body>
<div class="app-shell">
<header class="top"><div class="bar"><div class="brand"><div class="brand-wave"><i></i><i></i><i></i><i></i><i></i></div><span>Audify Web</span></div><div class="search"><input id="q" placeholder="Rechercher un titre ou un artiste…" autocomplete="off"><button id="go">Rechercher</button></div></div><div class="tabs"><button data-tab="home" class="on">Accueil</button><button data-tab="fav">♡ Favoris</button><button data-tab="history">Historique</button><button data-tab="queue">Playlist</button></div></header>
<main class="wrap"><section class="hero"><small>AUDIFY WEB · NEW PLAYER</small><h1>Ta musique, autrement.</h1><p>Clique sur un morceau pour ouvrir le nouveau lecteur immersif Audify.</p></section><div id="content" class="empty">Recherche une musique pour commencer.</div></main>
<audio id="audio" preload="metadata"></audio>
<div id="miniPlayer" class="mini-player"><button id="miniOpen" class="coverBtn" aria-label="Ouvrir le lecteur"><img id="pt" alt=""></button><div class="mini-now"><b id="pn">—</b><span id="pa">—</span></div><div class="mini-controls"><button id="prev">◀</button><button id="toggle" class="big">▶</button><button id="next">▶</button></div></div>
</div>
<section id="playerScreen" class="player-screen" aria-hidden="true">
<div id="ambientArt" class="ambient-art"></div><div class="ambient-bg"></div><div class="ambient-vignette"></div>
<div class="player-page">
<div class="player-head"><div class="player-brand"><div class="brand-wave"><i></i><i></i><i></i><i></i><i></i></div><span>Audify Web</span></div><div class="head-actions"><button id="closePlayer" class="icon-btn" title="Accueil">⌂</button><button id="addTop" class="icon-btn" title="Ajouter à la playlist">＋</button><button id="likeTop" class="icon-btn" title="J'aime">♡</button></div></div>
<div class="album-stage"><div id="vinyl" class="vinyl"></div><div class="album-sleeve"><img id="bigCover" alt="Pochette du morceau"></div></div>
<div class="track-meta"><h1 id="bigTitle">—</h1><p id="bigArtist">—</p></div>
<div class="control-panel"><div class="control-row">
<div class="action"><button id="likeMain" class="round" title="J'aime">♡</button><label>Like</label></div>
<div class="action"><button id="playMain" class="round play-main" title="Lecture / Pause">▶</button><label>Lecture</label></div>
<div class="action"><button id="karaokeBtn" class="round" title="Karaoké">🎤</button><label>Karaoké</label></div>
<div class="action"><button id="loopBtn" class="round" title="Lecture en boucle">↻</button><label>Boucle</label></div>
</div>
<div class="progress-wrap"><span id="curTime">0:00</span><input id="seek" class="seek" type="range" min="0" max="1000" value="0" aria-label="Progression"><span id="durTime">0:00</span></div>
<button id="playlistBtn" class="playlist-bar"><span class="note">☷♪</span><strong>Ajouter à la playlist</strong><span class="chev">›</span></button>
<div id="karaokeSheet" class="karaoke-sheet"><b>Mode Karaoké</b><span>Le bouton est prêt. Les paroles synchronisées seront branchées à la prochaine étape.</span></div>
</div></div></section>
<div id="toast" class="toast"></div>
<script src="./web-v70-app.js"></script>
</body></html>
