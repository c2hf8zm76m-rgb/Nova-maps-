nt-size:11px;color:var(--muted)}.line button{border:0;border-radius:10px;padding:9px;background:#ffffff0b;color:#fff}.toast{position:fixed;left:50%;bottom:95px;transform:translate(-50%,12px);opacity:0;z-index:60;padding:9px 13px;border-radius:999px;background:#fff;color:#080b10;font-weight:800;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:850px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:620px){.grid{grid-template-columns:repeat(2,1fr)}.logo{display:none}.player{grid-template-columns:48px minmax(0,1fr) auto}.thumb{width:48px;height:48px}.controls #prev,.controls #next{display:none}}@media(max-width:360px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="bar"><div class="logo">A</div><div class="search"><input id="q" placeholder="Rechercher un titre ou un artiste…" autocomplete="off"><button id="go">Rechercher</button></div></div><div class="tabs"><button data-tab="home" class="on">Accueil</button><button data-tab="fav">♡ Favoris</button><button data-tab="history">Historique</button><button data-tab="queue">File d’attente</button></div></header><main class="wrap"><section class="hero"><small>AUDIFY WEB · V70.4.2</small><h1>Ta musique, partout.</h1><p>Version web hébergée d’Audify — HTTPS et sans chargement bloquant.</p></section><div id="content" class="empty">Recherche une musique pour commencer.</div></main><audio id="audio" preload="metadata"></audio><div id="player" class="player"><img id="pt" class="thumb"><div class="now"><b id="pn">—</b><span id="pa">—</span></div><div class="controls"><button id="prev">◀</button><button id="toggle" class="big">▶</button><button id="next">▶</button></div></div><div id="toast" class="toast"></div><script src="./web-v70-app.js"></script></body></html>
